[project]
name = "commerce-signals"
version = "0.1.0"
description = "Churn prediction for e-commerce customers. ML portfolio project and real-product POC."
authors = [
    { name = "Commerce Signals" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "kedro>=1.5.0,<2.0",
    "kedro-datasets>=9.0,<10.0",
    "pymongo>=4.7,<5.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.1",
    "scikit-learn>=1.9.0",
    "shap==0.52.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12.0",
    "ipython>=9.16.1",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_signals"]

[tool.kedro]
kedro_init_version = "1.5.0"
project_name = "Commerce Signals"
package_name = "commerce_signals"
source_dir = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires a live MongoDB instance; auto-skipped by tests/conftest.py when unreachable",
]
[tool.kedro_telemetry]
project_id = "a95123ce086949fca586fe2e2afa5ed7"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
