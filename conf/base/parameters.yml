# Runtime parameters for Commerce Signals.
#
# Values are intentionally inert for M0. Subsequent milestones fill them
# in from real dataset exploration and tuning.

ingestion:
  source_path: data/01_raw/online_retail_II.xlsx

churn:
  # 90th percentile of real (non-cancellation) inter-purchase gaps in
  # this dataset, derived from actual data, not chosen arbitrarily.
  # See docs si existe un registro de esta decision, o el commit que
  # introduce este valor.
  threshold_days: 134

validation:
  # Fixed date the `has_future_invoice_date` flag is compared against.
  # Set to the day after the real max InvoiceDate in Online Retail II
  # (2011-12-09), so the flag has something meaningful to compare
  # against for this static historical dataset. If raw_transactions
  # is ever refreshed with newer data, bump this date, or set it back
  # to null to use the run-time clock again.
  reference_date: "2011-12-10"

feature_engineering:
  # First snapshot date, one month after the dataset's real start
  # (2009-12-01), so the earliest snapshot already reflects some
  # store activity. The LAST usable snapshot date is NOT a parameter:
  # se deriva en tiempo de ejecucion a partir del maximo invoice_date
  # real y churn.threshold_days (ver build_customer_snapshots).
  snapshot_start_date: "2010-01-01"

training:
  model_params:
    objective: binary
    boosting_type: gbdt
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 500
    random_state: 42
  eval_metric: binary_logloss
  early_stopping_rounds: 30
  test_snapshots_count: 3
  val_snapshots_count: 3
  precision_targets: [0.5, 0.7]
  mlflow_experiment_name: "commerce-signals-churn"
